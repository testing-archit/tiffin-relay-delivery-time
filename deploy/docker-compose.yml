# Whole MP098 stack on one machine:  docker compose -f deploy/docker-compose.yml up -d
#   caddy      :80/443  HTTPS front door: APP_DOMAIN -> web, GRAFANA_DOMAIN -> grafana
#   web        :3000  Next.js UI
#   grafana    :3001  dashboards (password protected)
#   api        :8000  FastAPI model service (internal; the UI proxies to it)
#   prometheus :9090  metrics + alert rules (internal)
#   mlflow     :5000  experiment tracking + model registry UI (internal)
#   watchtower        pulls new images pushed by CD and restarts the services
# Internal ports are bound to 127.0.0.1; reach them over an SSH tunnel.
name: mp098

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  api:
    image: ${REGISTRY:-ghcr.io/testing-archit}/mp098-api:${TAG:-latest}
    mem_limit: 512m
    env_file: [{path: .env, required: false}]   # GEMINI_API_KEY
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels: ["com.centurylinklabs.watchtower.enable=true"]

  web:
    image: ${REGISTRY:-ghcr.io/testing-archit}/mp098-web:${TAG:-latest}
    mem_limit: 256m
    environment: {API_URL: "http://api:8000"}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped
    logging: *logging
    labels: ["com.centurylinklabs.watchtower.enable=true"]

  caddy:
    image: caddy:2.10-alpine
    mem_limit: 128m
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-tiffin.architgupta.tech}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-grafana.tiffin.architgupta.tech}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    ports: ["80:80", "443:443", "443:443/udp"]   # udp: HTTP/3, copes better with packet loss
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [web, grafana]
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.5.0
    mem_limit: 256m
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:12.2.0
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in deploy/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mp098.json
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-grafana.tiffin.architgupta.tech}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
    logging: *logging

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.0
    mem_limit: 384m
    environment:
      # no background job runner: this project only browses runs (it spawns ~7 extra processes)
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    # Runs were logged with absolute artifact paths, so the folder is mounted at the same path.
    # one worker: it only serves people browsing runs (4 workers took ~2 GB)
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1",
              "--backend-store-uri", "sqlite:///${MLFLOW_HOME:-/srv/mp098/mlflow}/mlflow.db"]
    volumes: ["${MLFLOW_HOME:-/srv/mp098/mlflow}:${MLFLOW_HOME:-/srv/mp098/mlflow}",
              "${MLRUNS_DIR:-/srv/mp098/mlflow/mlruns}:${MLRUNS_MOUNT:-/Users/archit/Desktop/G220_MP098/mlruns}"]
    ports: ["127.0.0.1:5000:5000"]
    restart: unless-stopped
    logging: *logging
    profiles: ["tracking"]

  watchtower:
    image: containrrr/watchtower:latest
    mem_limit: 64m
    command: ["--label-enable", "--interval", "60", "--cleanup"]
    environment:
      DOCKER_API_VERSION: "1.44"   # Docker 29+ rejects watchtower's default API 1.25
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    restart: unless-stopped
    logging: *logging
    profiles: ["cd"]

volumes:
  prometheus:
  grafana:
  caddy:
