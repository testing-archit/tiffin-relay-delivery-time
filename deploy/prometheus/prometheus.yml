global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [alerts.yml]

scrape_configs:
  - job_name: mp098-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: {service: mp098-api}
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
