name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - run: pip install -r requirements.txt
    - name: API and cleaning tests (need data, so data tests skip if absent)
      run: pytest -q
    - name: findings.yaml is valid YAML
      run: python -c "import yaml; yaml.safe_load(open('findings.yaml'))"
    - name: Docker image builds
      run: docker build -t mp098-api:1.0 .
