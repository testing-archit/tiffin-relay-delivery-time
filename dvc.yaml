stages:
  issues:
    cmd: python -m src.issues
    deps: [src/issues.py, data/train.csv, data/holdout_features.csv, config.yaml]
    outs: [{reports/data_issues.json: {cache: false}}]
  clean:
    cmd: python -m src.data
    deps: [src/data.py, src/issues.py, data/train.csv, data/later.csv, config.yaml]
    outs: [data/processed/train_clean.csv, data/processed/later_clean.csv]
  train:
    cmd: python -m src.train
    deps: [src/train.py, src/model.py, data/processed/train_clean.csv, config.yaml]
    outs: [{reports/metrics.json: {cache: false}}]
  monitor:
    cmd: python -m src.monitor
    deps: [src/monitor.py, data/processed/train_clean.csv, data/processed/later_clean.csv, reports/metrics.json]
    outs: [{reports/monitoring.json: {cache: false}}]
  predict:
    cmd: python -m src.predict
    deps: [src/predict.py, data/holdout_features.csv, reports/monitoring.json]
    outs: [{predictions/holdout_predictions.csv: {cache: false}}, {models/model.joblib: {cache: false}}]
  findings:
    cmd: python -m src.findings
    deps: [src/findings.py, reports/data_issues.json, reports/metrics.json, reports/monitoring.json]
